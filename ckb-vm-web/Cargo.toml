[package]
name = "ckb-script-ipc-web"
version = "0.1.0"
edition = "2021"
description = "CKB VM WebAssembly wrapper for running CKB scripts with IPC in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ckb-vm = { version = "=0.24.13", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
